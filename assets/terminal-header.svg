<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Nimesh Johari</title>
  <desc id="desc">AI Pod Tech Lead, backend nerd, and friendly neighborhood AI prompt tuner</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111b2e"/>
      <stop offset="1" stop-color="#21153d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>
  <circle cx="1060" cy="72" r="100" fill="#58a6ff" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1110" cy="220" r="145" fill="#a371f7" opacity="0.08" filter="url(#softGlow)"/>

  <rect x="42" y="34" width="1116" height="232" rx="12" fill="#0d1117" fill-opacity="0.78" stroke="#30363d"/>
  <circle cx="72" cy="62" r="7" fill="#ff5f56"/>
  <circle cx="96" cy="62" r="7" fill="#ffbd2e"/>
  <circle cx="120" cy="62" r="7" fill="#27c93f"/>
  <text x="600" y="67" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">nimesh@brain: ~/github/profile</text>

  <text x="78" y="112" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ whoami</text>
  <text x="78" y="157" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700">NIMESH JOHARI</text>
  <text x="78" y="196" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">AI Pod Tech Lead · Backend Nerd · Prompt Tuner</text>
  <text x="78" y="230" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">build → observe → break safely → understand → automate → repeat</text>
  <rect x="696" y="216" width="10" height="19" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
